[package]
name = "kikoe"
version = "0.2.0"
edition = "2024"
description = "⛩️ 聴こえ (kikoe) — Ultra-fast temporal multi-slice audio language identification in pure Rust"
license = "MIT"

[lib]
name = "kikoe"
path = "src/lib.rs"

[[bin]]
name = "kikoe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ort = "2.0.0-rc.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
